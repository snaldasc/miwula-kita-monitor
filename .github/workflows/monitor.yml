name: MiWuLa KiTa Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:
  check-kita:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Startzeit erfassen
        run: |
          echo "START_TIME=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt

      - name: MiWuLa Seite prüfen
        id: monitor
        run: |
          python monitor.py

      - name: Zustand speichern
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Keine Änderung am Zustand."
          else
            git commit -m "Update MiWuLa KiTa status"
            git push
          fi

      - name: Gesamtlaufzeit berechnen
        if: always()
        run: |
          END_TIME=$(date +%s.%N)

          TOTAL_RUNTIME=$(python -c "
          start = float('$START_TIME')
          end = float('$END_TIME')
          print(f'{end - start:.2f}')
          ")

          echo "TOTAL_RUNTIME=$TOTAL_RUNTIME" >> "$GITHUB_ENV"

          echo "Gesamtlaufzeit: ${TOTAL_RUNTIME} Sekunden"

      - name: Telegram Status senden
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="🟢 Erfolgreich"
          else
            STATUS="🔴 Fehler"
          fi

          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="🟢 MiWuLa KiTa Monitor

Prüfung erfolgreich.

📅 Termine gefunden: ${{ steps.monitor.outputs.appointments }}
🆕 Neue Termine: ${{ steps.monitor.outputs.new_appointments }}

⏱️ Python: ${{ steps.monitor.outputs.python_runtime }} Sekunden
⏱️ Gesamt: ${TOTAL_RUNTIME} Sekunden

🔢 GitHub Run: ${{ github.run_number }}"
          else
            MESSAGE="🔴 MiWuLa KiTa Monitor

Fehler beim Ausführen des Monitors.

⏱️ Gesamt: ${TOTAL_RUNTIME} Sekunden

🔢 GitHub Run: ${{ github.run_number }}

Bitte GitHub Actions prüfen."
          fi

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
