name: MiWuLa KiTa Monitor

on:
  # Manueller Start über GitHub Actions
  workflow_dispatch:

  # Automatische Prüfung alle 15 Minuten
  schedule:
    - cron: "*/15 * * * *"


jobs:
  check-kita:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------
      # Repository auschecken
      # --------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Python einrichten
      # --------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # Abhängigkeiten installieren
      # --------------------------------------------------

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # --------------------------------------------------
      # MiWuLa Seite prüfen
      # --------------------------------------------------

      - name: MiWuLa Seite prüfen
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          python monitor.py


      # --------------------------------------------------
      # state.json speichern
      # --------------------------------------------------

      - name: Zustand speichern
        if: success()
        run: |
          git config user.name "MiWuLa KiTa Monitor"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Keine Änderung am Zustand."
          else
            git commit -m "Update MiWuLa KiTa Monitor state"
            git push
          fi
