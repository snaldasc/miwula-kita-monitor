name: MiWuLa KiTa Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"


jobs:
  check-kita:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Secrets prüfen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -n "$SMTP_HOST" ]; then echo "SMTP_HOST: vorhanden"; else echo "SMTP_HOST: FEHLT"; fi
          if [ -n "$SMTP_PORT" ]; then echo "SMTP_PORT: vorhanden"; else echo "SMTP_PORT: FEHLT"; fi
          if [ -n "$SMTP_USER" ]; then echo "SMTP_USER: vorhanden"; else echo "SMTP_USER: FEHLT"; fi
          if [ -n "$SMTP_PASSWORD" ]; then echo "SMTP_PASSWORD: vorhanden"; else echo "SMTP_PASSWORD: FEHLT"; fi
          if [ -n "$MAIL_TO" ]; then echo "MAIL_TO: vorhanden"; else echo "MAIL_TO: FEHLT"; fi

      - name: MiWuLa Seite prüfen
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py


      - name: Zustand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Keine Änderung am Zustand."
          else
            git commit -m "Update MiWuLa KiTa status"
            git push
          fi
