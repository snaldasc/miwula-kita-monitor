name: MiWuLa KiTa Monitor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop-check]

jobs:
  check-kita:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install requests bs4

      - name: MiWuLa Seite prüfen
        run: |
          python monitor.py

      # ---------------------------------------------
      # Eine einzige Telegram-Nachricht (ABSOLUT FEST ALS TEXT)
      # ---------------------------------------------
      - name: Telegram Status senden
        if: always()
        run: |
          # ERSETZE HIER DIE ZAHLEN DURCH DEINE ECHTE CHAT-ID VON CLICKALGO!
          CHAT_ID="5866136191"
          BOT_TOKEN="8849293486:AAF34D4gOgXT4_7s-KnTt4PJBaEvoO3hVQI"
          MESSAGE="🟢 MiWuLa KiTa Monitor: Prüfung erfolgreich durchgelaufen!"
          
          curl -sS -X POST "https://api.telegram.org/bot8849293486:AAF34D4gOgXT4_7s-KnTt4PJBaEvoO3hVQI/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      # ---------------------------------------------
      # BLITZSCHNELL & KOSTENLOS: Sofortiger Rerun ohne Wartezeit
      # ---------------------------------------------
      - name: Sofortiger Rerun-Befehl an die API
        if: always()
        run: |
          echo "Sende Rerun-Signal an GitHub API..."
          
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"event_type": "loop-check"}' \
            "https://api.github.com/repos/snaldasc/miwula-kita-monitor/dispatches
"
