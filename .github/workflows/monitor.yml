name: MiWuLa KiTa Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [loop-check]

jobs:
  check-kita:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Gesamtstartzeit erfassen
        run: |
          echo "START_TIME=$(date +%s.%N)" >> "$GITHUB_ENV"

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt

      - name: MiWuLa Seite prüfen
        id: monitor
        run: |
          python monitor.py

      - name: Zustand speichern
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Keine Änderung am Zustand."
          else
            git commit -m "Update MiWuLa KiTa status"
            git push
          fi

      - name: Gesamtlaufzeit berechnen
        if: always()
        run: |
          END_TIME=$(date +%s.%N)
          START_TIME="${{ env.START_TIME }}"
          if [ -n "$START_TIME" ]; then
            TOTAL_RUNTIME=$(awk "BEGIN {print $END_TIME - $START_TIME}")
            TOTAL_RUNTIME=$(printf "%.2f" $TOTAL_RUNTIME)
          else
            TOTAL_RUNTIME="0.00"
          fi
          echo "TOTAL_RUNTIME=$TOTAL_RUNTIME" >> "$GITHUB_ENV"

      - name: Telegram Status senden
        if: always()
        run: |
          MESSAGE="MiWuLa KiTa Monitor Run ${{ github.run_number }} - Status: ${{ job.status }}"
          curl -sS -X POST "https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Warteschleife und Neustart
        if: always()
        run: |
          echo "Warte 300 Sekunden..."
          sleep 300
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"event_type": "loop-check"}'
