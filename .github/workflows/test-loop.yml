name: API-Token Test-Schleife

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-loop-check]

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Warte 5 Sekunden
        run: |
          echo "Test startet..."
          sleep 5

      - name: Sende Rerun an GitHub API
        run: |
          echo "Sende Signal mit LOOP_TOKEN..."
          
          # HIER DEINEN NAMEN UND REPO-NAMEN EINTRAGEN (z.B. snaldasc/miwula-kita-monitor)
          curl -f -v -X POST \
            -H "Authorization: token ${{ secrets.LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"event_type": "test-loop-check"}'
