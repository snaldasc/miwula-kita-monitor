      # ---------------------------------------------
      # OPTION A: 5 Minuten warten und den nächsten Run triggern
      # ---------------------------------------------
      - name: Warteschleife und Neustart
        if: always()
        run: |
          echo "Warte 300 Sekunden (5 Minuten) bis zum nächsten Check..."
          sleep 300
          
          echo "Sende Rerun-Signal an GitHub API..."
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com \
            -d '{"event_type": "loop-check"}'
