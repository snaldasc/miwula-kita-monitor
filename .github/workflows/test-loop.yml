name: API-Token Test-Schleife

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-loop-check]

jobs:
  test-token:
    runs-on: ubuntu-latest
    steps:
      - name: Warte 5 Sekunden
        run: |
          echo "Test startet..."
          sleep 5

      - name: Sende Rerun an GitHub API
        env:
          # Wir bauen die URL sicher als GitHub-Variable außerhalb der Bash zusammen
          API_URL: "https://github.com{{ github.repository }}/dispatches"
        run: |
          echo "Sende Signal mit LOOP_TOKEN an $API_URL..."
          
          curl -f -v -X POST \
            -H "Authorization: token ${{ secrets.LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{"event_type": "test-loop-check"}' \
            "$API_URL"
